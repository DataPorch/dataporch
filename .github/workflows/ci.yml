name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.14"
          cache: true
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(git status --porcelain -- go.mod go.sum)"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

  core:
    name: Core (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.14", "stable"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Build
        run: go build -trimpath ./cmd/dataporch

      - name: Verify global Go installation
        shell: bash
        run: |
          install_root="$(mktemp -d)"
          test_home="$(mktemp -d)"
          trap 'rm -rf -- "$install_root" "$test_home"' EXIT
          GOBIN="$install_root" go install -trimpath ./cmd/dataporch
          PATH="$install_root:$PATH" HOME="$test_home" dataporch >"$install_root/bare-help.txt"
          PATH="$install_root:$PATH" HOME="$test_home" dataporch --help >"$install_root/flag-help.txt"
          cmp "$install_root/bare-help.txt" "$install_root/flag-help.txt"
          test "$(PATH="$install_root:$PATH" HOME="$test_home" dataporch --version)" = "dataporch devel"
          test ! -e "$test_home/.dataporch"

  container:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify immutable Docker bases
        shell: bash
        run: |
          test "$(grep -Ec '^FROM .+@sha256:[0-9a-f]{64}' Dockerfile)" -eq 2

      - name: Build local image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dataporch:ci

      - name: Scan local image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dataporch:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

  postgres-integration:
    name: PostgreSQL integration (${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: dataporch
          POSTGRES_USER: dataporch
          POSTGRES_PASSWORD: dataporch-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataporch -d dataporch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.14"
          cache: true
          cache-dependency-path: go.sum

      - name: Test PostgreSQL integration
        env:
          DATAPORCH_TEST_POSTGRES_DSN: postgres://dataporch:dataporch-test@127.0.0.1:5432/dataporch?sslmode=disable
        run: make test-integration-postgres

  sqlite-integration:
    name: SQLite integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.14"
          cache: true
          cache-dependency-path: go.sum

      - name: Test SQLite integration
        run: make test-integration-sqlite

  mysql-integration:
    name: MySQL integration (8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dataporch
          MYSQL_ROOT_PASSWORD: dataporch-root-test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdataporch-root-test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.14"
          cache: true
          cache-dependency-path: go.sum

      - name: Test MySQL integration
        env:
          DATAPORCH_TEST_MYSQL_DSN: mysql://root:dataporch-root-test@127.0.0.1:3306/dataporch?sslmode=disable
        run: make test-integration-mysql

  portable:
    name: Portable (CGO disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.14"
          cache: true
          cache-dependency-path: go.sum

      - name: Test with CGO disabled
        run: make test-cgo-disabled

      - name: Build with CGO disabled
        run: make build-cgo-disabled

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          args: --timeout=5m

      - name: Run golangci-lint with integration tag
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          args: --timeout=5m --build-tags=integration

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
